services:
  - type: web
    name: javou-mobilidade-entregas
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JAVOU_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: javou-db
          property: connectionString
      - key: JAVOU_ADMIN_KEY
        sync: false
      - key: JAVOU_PLATFORM_PIX_KEY
        value: ismaeliuraci1@gmail.com
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
databases:
  - name: javou-db
    plan: free
    databaseName: javou
    user: javou
